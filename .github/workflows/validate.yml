---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Validate Sanctuary

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "sanctuary-validation-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  incubation-contract:
    name: Incubation contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden runner
        # step-security/harden-runner v2.20.0
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate manifests and index
        run: python3 tools/validate_incubations.py --include-examples

      - name: Run unit tests
        run: python3 -m unittest discover --start-directory tests --verbose
