version: "3"

tasks:
  default:
    cmds:
      - task --list

  doctor:
    desc: Audit the complete shell system
    cmds:
      - ./bin/shell-doctor --deep

  syntax:
    desc: Validate Bash and Zsh syntax
    cmds:
      - |
        for file_path in .shellrc bin/* init/* lib/*.sh lib/bash/*.sh lib/core/*.sh \
          modules/*.sh platforms/*/*.sh runtime/shared/*.sh runtime/shells/*/*.sh; do
          test -f "${file_path}" || continue
          first_line="$(head -n 1 "${file_path}")"
          case "${first_line}" in
            *bash*) bash -n "${file_path}" ;;
            *zsh*) command -v zsh >/dev/null 2>&1 && zsh -n "${file_path}" ;;
          esac
        done

  lint:
    desc: Run warning-level ShellCheck over Bash and POSIX shell sources
    preconditions:
      - sh: command -v shellcheck >/dev/null 2>&1
        msg: Install ShellCheck first.
    cmds:
      - |
        shellcheck --severity=warning .shellrc
        for file_path in bin/* init/* lib/*.sh lib/bash/*.sh lib/core/*.sh \
          modules/*.sh platforms/*/*.sh runtime/shared/*.sh runtime/shells/*/*.sh \
          tests/*.bats; do
          test -f "${file_path}" || continue
          case "$(head -n 1 "${file_path}")" in
            *zsh*|*fish*) ;;
            *bash*|*bats*|"#!/bin/sh"*) shellcheck --severity=warning "${file_path}" ;;
          esac
        done

  format:
    desc: Format shell sources with shfmt
    preconditions:
      - sh: command -v shfmt >/dev/null 2>&1
        msg: Install shfmt first.
    cmds:
      - |
        shfmt --write --indent 2 --case-indent .shellrc
        for file_path in bin/* init/* lib/*.sh lib/bash/*.sh lib/core/*.sh \
          modules/*.sh platforms/*/*.sh runtime/shared/*.sh runtime/shells/*/*.sh \
          tests/*.bats; do
          test -f "${file_path}" || continue
          case "$(head -n 1 "${file_path}")" in
            *zsh*|*fish*) ;;
            *bash*|*bats*|"#!/bin/sh"*) shfmt --write --indent 2 --case-indent "${file_path}" ;;
          esac
        done

  test:
    desc: Run the Bats test suite
    preconditions:
      - sh: command -v bats >/dev/null 2>&1
        msg: Install Bats Core first.
    cmds:
      - bats tests

  check:
    desc: Run syntax, lint, tests, and the deep doctor
    deps: [syntax, lint, test, doctor]
